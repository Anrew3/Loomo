name: Bug report
description: Something in Loomo doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Loomo did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. New Harness
        2. Press C and place a connector
        3. …
  - type: input
    id: version
    attributes:
      label: Loomo version
      description: Loomo ▸ About Loomo, for example 0.4.0 (57)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Air M3
  - type: textarea
    id: report
    attributes:
      label: Crash or diagnostic report
      description: Help ▸ Diagnostic Reports. Attach a .loomo file only if it holds nothing private.
