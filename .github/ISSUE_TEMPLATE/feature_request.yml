name: Feature request
description: Suggest something Loomo should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The harness work it would help with, and how you do it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Loomo to do
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Drawings, screenshots, or other tools that do this well.
