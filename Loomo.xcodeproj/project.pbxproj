		F6A899ABBDA6A0907228307A /* Embed crimp CLI and schema */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Embed crimp CLI and schema";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Builds the crimp command-line tool from the CrimpKit package, signs it and puts it in the app\n# next to the main executable; copies the .loomo JSON Schema into Resources.\nset -euo pipefail\ncd \"$SRCROOT/Packages/CrimpKit\"\nCONFIG=release\n[ \"$CONFIGURATION\" = \"Debug\" ] && CONFIG=debug\n# Release builds are universal (Apple silicon and Intel), like the app; debug builds are for this Mac only.\nARCHS_ARGS=()\n[ \"$CONFIG\" = release ] && ARCHS_ARGS=(--arch arm64 --arch x86_64)\n# crimp's own Info.plist, linked into the binary: a sandboxed command-line tool won't start without a bundle\n# identifier, and the App Group it names is how crimp finds the app's live-editing socket.\nPLIST=\"$DERIVED_FILE_DIR/crimp-Info.plist\"\nrm -f \"$PLIST\"\n/usr/libexec/PlistBuddy -c \"Add :CFBundleIdentifier string $PRODUCT_BUNDLE_IDENTIFIER.crimp\" -c \"Add :CFBundleName string crimp\" -c \"Add :CFBundleInfoDictionaryVersion string 6.0\" -c \"Add :CFBundleShortVersionString string $MARKETING_VERSION\" -c \"Add :CFBundleVersion string $CURRENT_PROJECT_VERSION\" -c \"Add :LoomoAppGroup string ${LOOMO_APP_GROUP:-}\" \"$PLIST\" >/dev/null\n# A clean environment so Xcode's build variables don't leak into SwiftPM.\nenv -i PATH=\"/usr/bin:/bin:/usr/sbin:/sbin\" HOME=\"$HOME\" DEVELOPER_DIR=\"$DEVELOPER_DIR\" \\\n  swift build -c \"$CONFIG\" ${ARCHS_ARGS[@]+\"${ARCHS_ARGS[@]}\"} --product crimp --scratch-path \"$SRCROOT/Packages/CrimpKit/.build\" -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker \"$PLIST\" > \"$DERIVED_FILE_DIR/crimp-build.log\" 2>&1 \\\n  || { cat \"$DERIVED_FILE_DIR/crimp-build.log\"; exit 1; }\nBIN=\"$(env -i PATH=\"/usr/bin:/bin\" HOME=\"$HOME\" DEVELOPER_DIR=\"$DEVELOPER_DIR\" swift build -c \"$CONFIG\" ${ARCHS_ARGS[@]+\"${ARCHS_ARGS[@]}\"} --show-bin-path --scratch-path \"$SRCROOT/Packages/CrimpKit/.build\")\"\ncp -f \"$BIN/crimp\" \"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/crimp\"\n# App Store builds: every executable must be sandboxed; crimp joins the app's App Group to reach the live socket.\nENT_ARGS=()\nif [ -n \"${LOOMO_ENTITLEMENTS_SUFFIX:-}\" ]; then\n  sed \"s/\\$(TeamIdentifierPrefix)/${DEVELOPMENT_TEAM:+$DEVELOPMENT_TEAM.}/g\" \"$SRCROOT/App/Resources/crimp$LOOMO_ENTITLEMENTS_SUFFIX.entitlements\" > \"$DERIVED_FILE_DIR/crimp.entitlements\"\n  ENT_ARGS=(--entitlements \"$DERIVED_FILE_DIR/crimp.entitlements\" --identifier \"$PRODUCT_BUNDLE_IDENTIFIER.crimp\")\nfi\ncodesign --force --options runtime ${ENT_ARGS[@]+\"${ENT_ARGS[@]}\"} --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/crimp\"\ncp -f \"$SRCROOT/Schemas/loomo.schema.json\" \"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/loomo.schema.json\"\n";
		};
/* End PBXShellScriptBuildPhase section */

